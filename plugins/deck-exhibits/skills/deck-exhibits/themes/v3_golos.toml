# Тема по умолчанию: стиль дек v3 (по образцам McKinsey и BCG 2020-х).
# Единственное место, где живут цвета, шрифт и кегли. Функции приёмов знают только роли.
# Новый клиент или шаблон компании: копия этого файла с другими значениями, роли не меняются.

[meta]
name = "v3_golos"
about = "Golos Text, один насыщенный акцент, остальное серое; подписи у данных вместо легенд"

[canvas]
width = 1168          # ширина поля рисунка в px при масштабе 1:1 со слайдом 1280×720
gap = 14              # зазор между карточками и колонками
pad = 18              # внутренний отступ карточки
radius = 0            # скругление углов: в стиле v3 углы прямые (замечание 11.10), ядро обрезает любое rx до этого значения

[font]
family = "Golos Text"
fallback = "Arial, sans-serif"
file = "../fonts/GolosText-wght.ttf"   # путь от файла темы; по нему меряется ширина текста
bold_factor = 1.05    # во сколько раз 700 шире 400 (переменный шрифт меряется по 400)

# Кегли в px. «показ»: дека на экране, «чтение»: дека, которую читают глазами без докладчика.
[size."показ"]
big = 56              # большая цифра
delta = 40            # разница в панелях рядом (pair_delta из 2–3 панелей)
head = 18             # заголовок панели или карточки
label = 15            # подписи данных, категорий, текст карточек
small = 14            # вторичные подписи
note = 13             # сноски, «сегодня», база
min = 13              # ниже нельзя: проверка падает

[size."чтение"]
big = 48
delta = 34
head = 16
label = 14
small = 13
note = 12
min = 12

[color]
bg = "#FFFFFF"
ink = "#051C2C"        # основной текст
muted = "#656565"      # вторичный текст, подписи осей
line = "#CCCCCC"       # тонкие линии, разделители
line_soft = "#E6E6E6"  # сетка, если без неё никак
line_strong = "#757575" # ось, стрелки
surface = "#F2F2F2"    # подложка карточек
grey = "#C7C7C7"       # «прочие» данные
grey_light = "#E3E3E3" # «прочие» второго плана
accent = "#2251FF"     # то, о чём заголовок
accent_dark = "#061F79"
accent_mid = "#1537BA"
accent_soft = "#5C82FF"
accent_light = "#9DB7FF"
accent_pale = "#E5ECFF"
on_dark = "#FFFFFF"    # текст на тёмной заливке
good = "#0E7C4A"       # только плашки разницы и статусы, не серии
good_pale = "#DDF1E6"
bad = "#C8102E"
bad_pale = "#FBE3E7"
warn = "#E07B00"
# Бледные категории: только когда цвет несёт принадлежность (владелец рычага), не величину. Не больше трёх рядом с accent_pale.
cat_1 = "#DCE7F7"
cat_2 = "#DDF1E6"
cat_3 = "#FBE8CC"

# Шкала одного тона для тепловых таблиц и ступеней, от слабого к сильному.
ramp = ["accent_pale", "accent_light", "accent_soft", "accent", "accent_dark"]
# Если серий несколько и все важны: порядок назначения. Больше четырёх нельзя.
series = ["accent_dark", "accent", "accent_light", "grey"]
